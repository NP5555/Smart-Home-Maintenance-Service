name: smart-home-infra

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: smart-home-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_home
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart_home -d smart_home']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgis-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-home-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: smart-home-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: smart-home-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/evidence;
      mc mb --ignore-existing local/documents;
      mc mb --ignore-existing local/recordings;
      mc mb --ignore-existing local/reports;
      mc anonymous set none local/evidence local/documents local/recordings local/reports;
      exit 0;"

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: smart-home-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgis-data:
  redis-data:
  minio-data:
